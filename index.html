<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハンドベル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <h1>ハンドベル</h1>
    <span id="sensor-status" class="status">センサー OFF</span>
  </header>

  <section id="bell-stage" class="stage" aria-label="ベルをタップして鳴らす">
    <svg id="bell" class="bell" viewBox="0 0 200 230" role="img" aria-label="ハンドベル">
      <!-- 持ち手: 実物 (KC BC-08K/MU) と同じ白い棒状。色は変えない -->
      <rect x="91" y="10" width="18" height="82" rx="9" fill="#fffdf5" stroke="#ddd6c2" stroke-width="2"/>
      <ellipse cx="100" cy="11" rx="7" ry="3" fill="#cfc9b8"/>
      <!-- ベル本体: 全体をその音の色一色で塗る (金色にしない) -->
      <path id="bell-body" d="M100 84c-26 0-38 20-41 48l-6 42c-1 8 5 14 13 14h68c8 0 14-6 13-14l-6-42c-3-28-15-48-41-48z" fill="#1f7fc2"/>
      <!-- 光沢 (色ではなく反射表現。実物の白い反射点に倣う) -->
      <circle cx="74" cy="140" r="5" fill="#ffffff" opacity="0.45"/>
      <circle cx="86" cy="162" r="4" fill="#ffffff" opacity="0.35"/>
      <circle cx="126" cy="150" r="4" fill="#ffffff" opacity="0.3"/>
    </svg>
  </section>

  <section class="now" aria-live="polite">
    <div id="note-name" class="note-name">ソ</div>
  </section>

  <section class="controls">
    <input id="note-slider" type="range" min="0" max="7" step="1" value="4"
           aria-label="音階スライダー">
    <div id="note-labels" class="labels"></div>
  </section>

  <button id="enable-btn" class="enable" type="button">振るのを有効にする</button>
  <p class="hint">スマホを振るか、ベルをタップすると鳴ります</p>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
